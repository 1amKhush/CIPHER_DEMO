<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
</head>
<body>

<h1>My Notes</h1>

<a href="/create">Create Note</a>

<hr>

{{range .}}
    <h3>{{.Title}}</h3>
    <p>{{.Content}}</p>

    <a href="/edit?id={{.ID}}">Edit</a>
    <a href="/delete?id={{.ID}}">Delete</a>

    <hr>
{{else}}
    <p>No notes yet.</p>
{{end}}

</body>
</html>
